name: Github Actions

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: treeform/setup-nim-action@v6
      - name: Install dependencies
        shell: bash
        run: |
          cd ..
          nimby create
          nimby install "${{ github.event.repository.name }}/${{ github.event.repository.name }}.nimble"
      - run: nim check src/basic.nim
      - run: nim r tests/tests.nim
      - name: Test release execution
        run: nim r -d:release tests/tests.nim
      - name: Test explicit sandbox checks
        run: nim r -d:danger tests/tests.nim
      - name: Run examples
        run: |
          nim r examples/hello.nim
          nim r examples/hosts.nim
          nim r examples/strings.nim
          nim r examples/floats.nim
          nim r examples/natural_strings.nim
